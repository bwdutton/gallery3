test:
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: ["8.2"]
        DBSERVICE: ["mysql:8"]
  image: php:$PHP_VERSION
  services:
    - $DBSERVICE
  before_script:
    - rm /etc/apt/apt.conf.d/docker*
    - echo "Dir::State::Lists \"$CI_PROJECT_DIR/apt/lists\";" > /etc/apt/apt.conf.d/99custom-path
    - echo "Dir::Cache \"$CI_PROJECT_DIR/apt/cache\";" > /etc/apt/apt.conf.d/99custom-cache
#    - apt-get update
# php images seem to be upgraded regularly
#    - apt-get upgrade
    - apt-get install -y imagemagick graphicsmagick dcraw ffmpeg git zip mariadb-client zip
    - docker-php-ext-install mysqli
# should be restored from the cached copy
#    - curl --show-error --silent "https://getcomposer.org/installer" | php
    - php composer.phar install --prefer-dist --no-progress
#    mysql image does this for us
#    - mysql -e "CREATE DATABASE ${DB_DATABASE};" --skip-ssl -u${DB_USER} -p${DB_PASSWORD} -h${DB_HOST}
    - mysql -e "CREATE DATABASE ${DB_DATABASE}_test;" --skip-ssl -u${DB_USER} -p${DB_PASSWORD} -h${DB_HOST}
  script:
    - bin/linter.sh
    - bin/phpcs.sh
    - php ./installer/index.php
    - php index.php test
